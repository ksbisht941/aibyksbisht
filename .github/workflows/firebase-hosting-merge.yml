name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build
        
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_AIBYKSBISHT }}'
          channelId: live
          projectId: aibyksbisht

      - name: Send Email on Failure
        if: failure() && env.MAIL_TO != ''
        env:
          MAIL_TO: '${{ secrets.MAIL_TO_ADDRESS }}'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: '${{ secrets.MAIL_USERNAME }}'
          password: '${{ secrets.MAIL_PASSWORD }}'
          subject: 🚨 Deployment Failed - Portfolio Project
          to: '${{ secrets.MAIL_TO_ADDRESS }}'
          from: GitHub Actions
          body: The automated deployment job for your portfolio project failed on branch ${{ github.ref }}. Please check the GitHub Actions logs for details.
